spring:
  application:
    name: route-optimizer
  config:
    # Reads backend/.env as a properties file when present. Real environment variables still win
    # over it, so CI and containers can override anything without editing the file.
    import: optional:file:.env[.properties]
  datasource:
    # No AUTO_SERVER: it keeps the database alive in server mode after the owning process is asked
    # to stop, so deleting the files appears to work and changes nothing. One process at a time is
    # all this needs, and an exclusive lock makes "delete the folder to reset" behave as expected.
    url: jdbc:h2:file:./data/routeopt
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.routeopt: DEBUG

app:
  cors:
    allowed-origins: http://localhost:4200

  ai:
    # Resolved from the ANTHROPIC_API_KEY environment variable or from backend/.env.
    # Blank means free-form parsing is disabled; everything else still works.
    api-key: ${ANTHROPIC_API_KEY:}
    # Model used to extract structured orders from free-form text.
    model: claude-sonnet-5
    # max-tokens must cover thinking plus the JSON answer; do not drop below ~4000.
    max-tokens: 8000
    # low | medium | high | xhigh | max (the API only accepts lowercase)
    effort: low

  # Driver shifts, in the order they are filled. They run in parallel, each starting from the
  # depot at its own time, so the overlap is deliberate: the afternoon driver is already out
  # before the morning one is due back. Together they cover the 06:00-20:00 operating window.
  shifts:
    - name: Morning
      start: "06:00"
      max-hours: 8
    - name: Afternoon
      start: "12:00"
      max-hours: 8

  geocoding:
    base-url: https://nominatim.openstreetmap.org
    # Nominatim's usage policy requires an identifying User-Agent and at most 1 req/s.
    user-agent: route-optimizer/0.1 (https://github.com/example/route-optimizer)
    country-codes: mx
    min-interval-millis: 1100

  routing:
    # osrm  -> real road distances and a route line that follows streets
    # haversine -> offline approximation, straight segments drawn dashed
    # OSRM failures fall back to haversine automatically and say so in the response.
    matrix: osrm
    # Multiplier applied to straight-line distance to approximate road distance.
    detour-factor: 1.3
    average-speed-kmh: 30
    default-service-minutes: 5
    # Cost penalties, expressed in metres so they are comparable with distance.
    late-penalty-per-minute: 500
    priority-penalty-per-position: 200
    max-iterations: 1000
    # A stop further than this from the depot is warned about as a probable geocoding error.
    # It is never excluded from the route. Set to 0 to disable the check.
    max-stop-distance-km: 150
    # The operating window, measured from the first shift's start: 06:00 to 20:00.
    # It binds exactly at the default settings - the afternoon driver's eight hours end at 20:00
    # on the dot - so a third shift, or a later start, gets no budget and is reported as skipped.
    max-operational-hours: 14
    osrm:
      base-url: https://router.project-osrm.org
      timeout-seconds: 10
      # Detail of the drawn route line: full | simplified.
      # Point count grows with route length; switch to simplified if payload size matters.
      overview: full
